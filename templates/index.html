<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Match AI Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="dashboard-container">
        
        <header>
            <h1>SKILL MATCH AI</h1>
            <p>Automated Resume Screener & Skill-Matcher</p>
        </header>

        
        <main class="workspace">
            
            <aside class="upload-section">
                <div class="upload-controls">
                    <button id="upload-btn" class="plus-btn" aria-label="Upload Resumes">+</button>
                    <h2>Attach Resumes</h2>
                    <p>Select PDF files to analyze</p>

                    
                    <input type="file" id="file-input" accept=".pdf" multiple hidden>
                </div>

                
                <ul id="file-list" class="file-list"></ul>
            </aside>

            
            <section class="job-section">
                <div class="job-box">
                    <h2>Job Description</h2>
                    <textarea id="job-desc"
                        placeholder="Paste the target job description or required skills here..."></textarea>
                </div>

                <button id="analyze-btn" class="primary-btn" disabled>Match Candidates</button>
            </section>
        </main>

       
        <section class="results-section">
            <h2 id="results-title">Analysis Results</h2>
            <div id="candidate-grid" class="candidate-grid">
                <p class="placeholder-text">Upload resumes and enter a job description to see matches.</p>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
